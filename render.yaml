services:
  # ── Go API ──────────────────────────────────────────────────────────────────
  - type: web
    name: rucha-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8081"
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        value: "9001526833:AAH2XCQ8mcuAgz_BZFzYsIPmMQZrKe8atXw"
      - key: TELEGRAM_BOT_USERNAME
        value: "ruchaabot"
      - key: DATABASE_URL
        fromDatabase:
          name: rucha-db
          property: connectionString

databases:
  # ── PostgreSQL — free tier, 1 GB storage, never sleeps ─────────────────────
  - name: rucha-db
    plan: free
    databaseName: rucha
    user: rucha
    region: oregon
